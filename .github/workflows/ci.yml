name: CI

on:
  push:
    branches: [main]
    paths:
      - 'memory_core/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release-and-dispatch.yml'
  # pull_request 不做 paths 过滤：required check 必须在所有 PR 上报告，
  # 否则未触碰 paths 的 PR（如纯文档变更）会因等不到 check 而永久无法合并
  pull_request:
    branches: [main]

# 同一 PR 的新 push 取消仍在跑的旧 CI run（消除 runner 堆叠与排队），
# main 分支不取消（保证发布链路 CI 完整跑完，不被 push 竞态截断）
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # INFRA-569：CI 全量切自建 runner（pve-linux）。GitHub-hosted 在配额耗尽/
    # rerun 场景会 queued 无作业而永久卡死（实证：run 32215817674 六 job 挂 7 天）；
    # pve 2 台 runner 常时在线，concurrency 已消除同 PR 堆叠。
    runs-on: [self-hosted, pve-linux]
    strategy:
      matrix:
        python-version: ["3.12"]
    # INFRA-569：防挂死占位——全量测试 + 覆盖率历史上限 ~30min，45min 上限
    # 给慢隧道下载留余量；无超时的挂死 job 会永久占用自建 runner 槽位
    # （GitHub-hosted 的 queued 卡死正是本 issue 要消除的故障模式）。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 浅克隆，加速 checkout（自建 runner 走代理隧道，全量历史拉取慢）
      # INFRA-569：按运行隔离 venv。旧模式 pip 装进 ~/.local（跨 run 残留，
      # rerun 时旧包毒化新 run）且系统 site-packages 存在 pip install -e 管不到
      # 的旧副本（2026-08-25 版本遮蔽教训）。venv 按 run_id+attempt 放 RUNNER_TEMP，
      # job 结束自动清理，rerun 从零解析。
      - uses: ./.github/actions/setup-venv
      - name: Timestamp - build start
        run: |
          echo "Build started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest pytest-cov pytest-xdist
      - name: Gateway import smoke test
        run: |
          # 验证 gateway 门面可导入（拆分后符号完整性检查）
          PYTHONPATH=. python -c 'import memory_core.tools.memory_hook_gateway'
      - name: Timestamp - after install
        run: |
          echo "Install completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Lint with ruff
        run: |
          pip install --disable-pip-version-check ruff==0.16.1
          ruff check .
      - name: Format check with ruff
        run: |
          ruff format --check .
      - name: Install shellcheck and actionlint
        shell: bash
        run: |
          # Layer 1: 优先使用宿主预装的工具（runner-tools.toml 锁定版本）
          # 仅在宿主未预装时才 fallback 下载到 job 本地目录（2026-08-28 runner-hardening）
          # 不用 sudo：自建 runner 刻意无 NOPASSWD，工具装进 workspace 即可。
          if command -v shellcheck >/dev/null 2>&1; then
            echo "✓ Using host shellcheck: $(shellcheck --version | head -2)"
          else
            echo "::warning::shellcheck not found on host, falling back to download"
            # fallback 版本对齐 runner-tools.toml [tools]（宿主实测，test_runner_toolchain_contract 钉住）
            wget -q https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
            tar -xf shellcheck-v0.10.0.linux.x86_64.tar.xz -C "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP/shellcheck-v0.10.0:$PATH"
            echo "$RUNNER_TEMP/shellcheck-v0.10.0" >> "$GITHUB_PATH"
            rm -f shellcheck-v0.10.0.linux.x86_64.tar.xz
            shellcheck --version | head -2
          fi
          if command -v actionlint >/dev/null 2>&1; then
            echo "✓ Using host actionlint: $(actionlint --version)"
          else
            echo "::warning::actionlint not found on host, falling back to download"
            # fallback 版本对齐 runner-tools.toml [tools]（宿主实测，test_runner_toolchain_contract 钉住）
            wget -q https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz
            tar -xzf actionlint_1.7.11_linux_amd64.tar.gz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            rm -f actionlint_1.7.11_linux_amd64.tar.gz
            actionlint --version | head -1
          fi
      - name: Shell lint
        shell: bash
        run: |
          find . -name '*.sh' -not -path './.venv/*' -not -path './.git/*' -not -path './node_modules/*' -print0 | xargs -0 shellcheck -x
          # 自建 label（pve-linux）已通过 .github/actionlint.yaml 声明，无需过滤
          actionlint .github/workflows/*.yml
      - name: BOUNDARY pollution guard
        run: python scripts/check_boundary.py
      - name: Document classification guard
        run: python scripts/check_doc_classification.py
      - name: Fix-has-test guard
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_fix_has_test.py --pr ${{ github.event.pull_request.number }}
      - name: PR reference consistency guard
        # VAL-GATE-201/202/204：PR 引用的镜像 issue linkback INFRA 号
        # 必须 ⊆ PR body 的 Fixes INFRA 集合；严格只读（仅 gh pr view / gh issue view）
        # step 级 if 而非 job 级——push main 时跳过本 step，不影响 test job 聚合进 ci-ok
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_pr_ref_consistency.py ${{ github.event.pull_request.number }}
      - name: Run tests with coverage
        env:
          # Isolate coverage data files to prevent cross-job interference on shared runners
          # (pytest-cov combine/erase globs can delete .coverage.* from concurrent processes)
          COVERAGE_FILE: ${{ runner.temp }}/cov-${{ github.run_id }}-${{ github.run_attempt }}/.coverage
        run: |
          mkdir -p "$(dirname "$COVERAGE_FILE")"
          # CI 串行（-n 0）裁决依据（2026-08-20 编排器裁定）：
          # - A/B 对照实锤 runner-01 上 xdist 分片丢失：同 job 串行 TOTAL 14298/miss 2288=84%
          #   vs 并行 miss 8087=43%；runner-02 隔离后串行同样 84%
          # - 串行在两 runner 上均实测 84% 正确，~5 分钟/job 可接受
          # - 本地 -n 6 并行验证标准不变（addopts 未动）
          # - COVERAGE_FILE 隔离 env 保留，保护未来恢复并行
          # - 不违反 VAL-COV-015（该断言禁 no:randomly/固定 seed，不禁分发模式）
          python -m pytest -q tests -n 0 --cov=memory_core --cov-report=xml
      - name: Timestamp - after tests
        run: |
          echo "Tests completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Detect preinstalled Codecov CLI
        # INFRA-422：优先用 runner 预装 CLI（ce-01 /usr/local/bin/codecov，见 runbook
        # 2026-08-18-pve-runner-sop），跳过 wrapper 每次 9.9MB 下载 + GPG 校验（实测
        # 419s → 5.9s）。注意：PVE 回滚快照 base-runner-ready-20260818-v2 早于 CLI
        # 预装时间（2026-08-19 01:23），回滚后 CLI 不存在——wrapper 对「binary 指向
        # 不存在文件」不下载而是空命令静默失败（fail_ci_if_error=false 掩盖）。
        # 故运行时探测：预装在则传路径，缺失则传空串回退 wrapper 自动下载。
        id: codecov-cli
        if: always()
        run: |
          if [ -x /usr/local/bin/codecov ]; then
            echo "path=/usr/local/bin/codecov" >> "$GITHUB_OUTPUT"
            echo "Codecov CLI: preinstalled /usr/local/bin/codecov ($(/usr/local/bin/codecov --version 2>/dev/null || echo unknown))"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::Preinstalled Codecov CLI not found (runner rolled back?), falling back to wrapper download (~3-4 min over slow tunnel)"
          fi
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          # 预装 CLI 路径（存在）或空串（缺失时 wrapper 自动下载），
          # 由上方探测 step 决定，避免硬编码路径在 runner 回滚后静默失败
          binary: ${{ steps.codecov-cli.outputs.path }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Health check (validate + pollution)
        run: bash scripts/ci_health_check.sh
      - name: Full integration test
        # exit 0 = all pass, 2 = warnings/skips only (expected on CI runner
        # which has no local consumer projects), 1 = actual failure
        run: |
          python scripts/test_full_integration.py || code=$?
          if [ "${code:-0}" = "1" ]; then exit 1; fi
      - name: Repo delivery consistency check
        run: bash scripts/repo_health_check.sh --ci
      - name: Scan TODO/FIXME comments (advisory)
        shell: bash
        continue-on-error: true
        run: |
          echo "=== TODO/FIXME scan in memory_core/ and scripts/ ==="
          grep -rn --include="*.py" -E "TODO|FIXME" memory_core/ scripts/ || true
          echo "=== TODO/FIXME scan complete ==="
      - name: Check dependency usage with deptry
        run: |
          pip install --disable-pip-version-check deptry
          deptry .
      - name: Generate API documentation with pdoc (advisory)
        continue-on-error: true
        run: |
          pip install --disable-pip-version-check pdoc
          pdoc -o docs/api memory_core
          test -n "$(find docs/api -type f \( -name '*.html' -o -name '*.md' \) -print -quit)" && echo "PDOC_OUTPUT_OK" || echo "FAIL"

  # INFRA-569：以下 job 全部从 ubuntu-latest 切到自建 runner。GitHub-hosted
  # 在配额/rerun 场景 queued 无作业卡死（run 32215817674 实证）；安全敏感的
  # pull_request_target 工作流（droid-review / evolution-governance）不在此列，
  # 必须保持 GitHub-hosted（不受 PR 内容影响的受信定义 + secrets 边界）。
  advisory-security:
    name: Advisory dependency security scan
    runs-on: [self-hosted, pve-linux]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-venv
      - name: Install package and pip-audit
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pip-audit
      # 2026-09-04: pip-audit 自建 runner → pypi.org JSON API 间歇性读超时（round 4 CI 连续两轮同因失败，
      # watchdog cancel-on-ci-fail 连杀 droid-review）。加 ×3 退避重试 + --timeout 60（默认 15s）。
      - name: Dependency audit
        run: |
          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::notice::pip-audit attempt $attempt/$max_attempts"
            if pip-audit --progress-spinner off --timeout 60; then
              echo "::notice::pip-audit succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::pip-audit attempt $attempt failed"
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::notice::Retrying in 30 seconds..."
              sleep 30
            fi
            attempt=$((attempt + 1))
          done
          echo "::error::pip-audit failed after $max_attempts attempts"
          exit 1

  advisory-telemetry-audit:
    name: Advisory telemetry coverage audit
    runs-on: [self-hosted, pve-linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Telemetry coverage audit
        run: bash scripts/audit_telemetry_coverage.sh

  mypy-strict-memory-core:
    name: Enforce mypy --strict (memory_core/)
    runs-on: [self-hosted, pve-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-venv
      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check mypy==2.3.0
      - name: Run mypy --strict (memory_core/)
        shell: bash
        run: |
          echo "mypy --strict on memory_core/ (hard gate)"
          python -m mypy --strict memory_core/ 2>&1 | tee mypy-report.txt
          echo "---"
          echo "Report written to mypy-report.txt"

  # 聚合门禁：branch protection 只需 required 这一个 check，
  # 改动 test 的 Python 矩阵时无需同步调整 protection 配置
  mypy-strict-scripts:
    name: Enforce mypy --strict (scripts/)
    runs-on: [self-hosted, pve-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-venv
      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check mypy==2.3.0
      - name: Run mypy --strict on scripts/
        run: python -m mypy --strict scripts/

  ci-ok:
    name: ci-ok
    runs-on: [self-hosted, pve-linux]
    timeout-minutes: 90
    needs: [test, advisory-security, advisory-telemetry-audit, mypy-strict-scripts, mypy-strict-memory-core]
    if: always()
    steps:
      # INFRA-569：check_droid_review.sh 的两阶段结论解析依赖 jq，
      # 自建 runner 不保证预装，兜底装进 RUNNER_TEMP（job 结束自动清理）
      - uses: ./.github/actions/ensure-jq
      - name: Verify all required jobs succeeded
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "advisory-security: ${{ needs.advisory-security.result }}"
          echo "advisory-telemetry-audit: ${{ needs.advisory-telemetry-audit.result }}"
          echo "mypy-strict-scripts: ${{ needs.mypy-strict-scripts.result }}"
          echo "mypy-strict-memory-core: ${{ needs.mypy-strict-memory-core.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "FAIL: test did not succeed"; exit 1
          fi
          if [ "${{ needs.advisory-security.result }}" != "success" ]; then
            echo "FAIL: dependency security scan did not succeed"; exit 1
          fi
          if [ "${{ needs.advisory-telemetry-audit.result }}" != "success" ]; then
            echo "FAIL: telemetry coverage audit did not succeed"; exit 1
          fi
          if [ "${{ needs.mypy-strict-scripts.result }}" != "success" ]; then
            echo "FAIL: mypy --strict scripts/ did not succeed"; exit 1
          fi
          if [ "${{ needs.mypy-strict-memory-core.result }}" != "success" ]; then
            echo "FAIL: mypy --strict memory_core/ did not succeed"; exit 1
          fi
          echo "All required jobs succeeded."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check droid-review status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/check_droid_review.sh \
            "${{ github.event_name }}" \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "$GH_TOKEN"

  notify-ci-complete:
    name: Notify CI complete to n8n
    runs-on: [self-hosted, pve-linux]
    timeout-minutes: 10
    needs: ci-ok
    if: always() && github.event_name == 'pull_request'
    steps:
      # INFRA-569：webhook payload 组装依赖 jq，自建 runner 不保证预装，兜底安装
      - uses: ./.github/actions/ensure-jq
      - name: Verify webhook secrets
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::N8N_CI_WEBHOOK_URL secret is not configured, skipping notification"
            exit 0
          fi
          if [ -z "$N8N_CI_TOKEN" ]; then
            echo "::warning::N8N_CI_TOKEN secret is not configured, skipping notification"
            exit 0
          fi
        env:
          WEBHOOK_URL: ${{ secrets.N8N_CI_WEBHOOK_URL }}
          N8N_CI_TOKEN: ${{ secrets.N8N_CI_TOKEN }}

      - name: Send CI status webhook
        env:
          WEBHOOK_URL: ${{ secrets.N8N_CI_WEBHOOK_URL }}
          N8N_CI_TOKEN: ${{ secrets.N8N_CI_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --argjson pr_number "${{ github.event.pull_request.number || 0 }}" \
            --arg branch "$BRANCH" \
            --arg sha "${{ github.sha }}" \
            --arg status "${{ needs.ci-ok.result }}" \
            '{repo:$repo, pr_number:$pr_number, branch:$branch, sha:$sha, status:$status}')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-CI-Token: ${N8N_CI_TOKEN}" \
            -d "$PAYLOAD") || HTTP_CODE="000"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Webhook delivery failed (HTTP $HTTP_CODE)"
            # Only send PostHog event if API key is configured
            if [ -n "$POSTHOG_API_KEY" ]; then
              PR_NUM="${{ github.event.pull_request.number || 0 }}"
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              curl -s -X POST "https://us.posthog.com/batch/" \
                -H "Content-Type: application/json" \
                -d "{\"api_key\":\"${POSTHOG_API_KEY}\",\"batch\":[{\"event\":\"ci_webhook_send_failed\",\"properties\":{\"error_type\":\"webhook_delivery_failed\",\"pr_number\":\"$PR_NUM\",\"stage\":\"github_actions\",\"workflow\":\"ci\",\"detail\":\"HTTP $HTTP_CODE\",\"distinct_id\":\"ci-webhook\"},\"timestamp\":\"$TIMESTAMP\"}]}" || true
            else
              echo "::notice::POSTHOG_API_KEY not configured, skipping event reporting"
            fi
          fi
          exit 0
