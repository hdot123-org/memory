# Droid Auto Review Workflow
# Uses Bailian (Qwen 3.7 Plus) via Kong Proxy BYOM configuration
# Kong Proxy at ai.exa.edu.kg routes qwen3.7-plus to node1 via Tailscale
# BYOM customModels written to ~/.factory/settings.json before droid-action runs
# (droid-action `settings` input targets ~/.factory/droid/settings.json which is
#  a separate config namespace — customModels must go in ~/.factory/settings.json)

name: Droid Auto Review

# Security: use pull_request_target only.
# This runs the workflow from the BASE branch (main), not the PR head,
# preventing malicious PRs from accessing secrets via modified workflows.
# The ref fix below ensures the correct PR code is checked out for review.
on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVIDIA_KONG_PROXY_KEY: ${{ secrets.NVIDIA_KONG_PROXY_KEY }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Detect docs-only PR
        id: docs_only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          echo "Detecting whether PR #$PR_NUMBER changes only docs files (*.md)..."
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          if [ -z "$FILES" ]; then
            echo "File list empty or API failure — fail-closed, run full review"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NON_MD=$(echo "$FILES" | grep -v '\.md$' || true)
          if [ -z "$NON_MD" ]; then
            echo "docs-only=true — all changed files are *.md, skipping model review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false — non-md files present:"
            echo "$NON_MD"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write BYOM settings file
        if: steps.docs_only.outputs.skip != 'true'
        run: |
          mkdir -p ~/.factory
          cat > ~/.factory/settings.json << 'SETTINGS_EOF'
          {
            "customModels": [
              {
                "model": "qwen3.7-plus",
                "displayName": "Bailian Qwen 3.7 Plus",
                "baseUrl": "https://ai.exa.edu.kg/v1",
                "apiKey": "${NVIDIA_KONG_PROXY_KEY}",
                "provider": "generic-chat-completion-api",
                "maxOutputTokens": 65536,
                "noImageSupport": true
              }
            ]
          }
          SETTINGS_EOF
          echo "BYOM settings written to ~/.factory/settings.json"
          python3 -c "import json; json.load(open('$HOME/.factory/settings.json')); print('JSON validation passed')"
      - name: Pre-check credentials
        if: steps.docs_only.outputs.skip != 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          echo "Verifying Factory API credentials before review..."
          if [ -z "$FACTORY_API_KEY" ]; then
            echo "::error::FACTORY_API_KEY secret is empty or not configured."
            echo "::error::This is the root cause of the 2026-08-16 multi-hour hang."
            echo "::error::Please update the GitHub secret with a valid key."
            exit 1
          fi
          echo "Secret is present (length: ${#FACTORY_API_KEY} chars)."
          echo "Note: HTTP endpoint validation removed - /v1/auth/check returns 404 (endpoint does not exist)."
          echo "droid-action will fail fast if credentials are invalid (45-minute timeout prevents hangs)."
      - name: Run Droid Auto Review
        id: droid_review_run
        if: steps.docs_only.outputs.skip != 'true'
        uses: Factory-AI/droid-action@e5ae50268211d2e9ac85edb57c28bf253b6627f7
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_model: "qwen3.7-plus"
          allowed_bots: "dependabot[bot]"
          security_block_on_high: "false"

      # TD-503-01（2026-08-18）：droid-action 的 prep 阶段会调 GitHub API
      # （GET /collaborators/<actor>/permission）做权限检查，2026-08-17/18 的
      # 持续 503 让 review 在本体开始前就 exit 1，每个 PR 都要人工 rerun。
      # droid-action 是 composite action，无法用 retry-action 包装 uses，故采用
      # 失败后自动 re-run 本 job 的自愈路径：识别「infra 瞬时失败」特征后立即
      # 触发 GitHub 的 rerun-failed-jobs API，本轮仍以 failure 结算（保持
      # fail-closed，不带病合并），rerun 的那轮才是有效 review。
      # 真代码审查发现（P1/P2）不含这些日志特征，不会触发 rerun——门禁语义不变。
      - name: Self-heal rerun on infra-transient failure
        if: failure() && steps.docs_only.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          echo "droid-action failed; checking whether it was an infra-transient (503) failure..."
          # 失败特征匹配：prep 阶段的 GitHub API 503/网络瞬时错误（来自 2026-08-17/18 实测日志）
          PATTERNS='permission - 503|Failed to check permissions|HttpError: No server is currently available|unexpected EOF|TLS handshake timeout'
          JOB_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[0].id')
          MATCH=""
          if gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" 2>/dev/null | grep -qE "$PATTERNS"; then
            MATCH="infra-transient-503"
          fi
          if [ -n "$MATCH" ]; then
            echo "Infra-transient failure detected. Requesting rerun of failed jobs..."
            if gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" 2>&1; then
              echo "Rerun requested. This run concludes as failure (fail-closed); the rerun carries the effective review."
            else
              echo "::warning::Rerun request failed (503 storm?). Manual rerun still possible; not bypassing gate."
            fi
          else
            echo "Failure does not match infra-transient patterns — likely a real review finding or credential issue. No auto-rerun."
          fi
