# Droid Auto Review — 3-job shard pipeline (TD-DR-01)
# Three contracts (NEVER break):
#   1. Workflow name: "Droid Auto Review"
#   2. Aggregation job name: "droid-review" (branch-protection/ci-ok dependency)
#   3. Artifact prefix: "droid-review-debug-" (watchdog quota-sweep dependency)
#
# Security: pull_request_target + dual checkout (BASE for scripts/prompt, HEAD for context)
# BYOM: Bailian Qwen 3.7 Plus via Kong Proxy
#
# Budget layers (VAL-SHARD-011):
#   Layer 1: shard job timeout-minutes (default 30)
#   Layer 2: aggregation path timeout = DROID_REVIEW_TIMEOUT_MINUTES (default 90)
#   Layer 3: shard size cap (SHARD_MAX_FILES / SHARD_MAX_LINES)
#   Layer 4: concurrency cap (SHARD_MAX_PARALLEL)
#   Layer 5: prompt budget instructions (embedded in shard-review-prompt.md)

name: Droid Auto Review

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Plan shards (no model call, ~1min) ──
  plan-shards:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      docs_only: ${{ steps.docs_only.outputs.skip }}
    steps:
      - name: Checkout repository (BASE)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Detect docs-only PR
        id: docs_only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          echo "Detecting whether PR #$PR_NUMBER changes only docs files (*.md)..."
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          if [ -z "$FILES" ]; then
            echo "File list empty or API failure — fail-closed, run full review"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NON_MD=$(echo "$FILES" | grep -v '\.md$' || true)
          if [ -z "$NON_MD" ]; then
            echo "docs-only=true — all changed files are *.md, skipping model review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false — non-md files present:"
            echo "$NON_MD"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan shards
        id: plan
        if: steps.docs_only.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_FILES: ${{ vars.SHARD_MAX_FILES || '25' }}
          MAX_COUNT: ${{ vars.SHARD_MAX_COUNT || '6' }}
        run: |
          set -eu
          # Get changed files from PR (with status for deleted-file handling)
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[] | .filename + "\t" + .status' > changed_files_with_status.txt
          # Extract just filenames for planner
          cut -f1 changed_files_with_status.txt > changed_files.txt
          # Filter out docs-only files
          grep -v '\.md$' changed_files.txt > code_files.txt || true
          # Run planner
          if [ -s code_files.txt ]; then
            PLAN=$(python3 scripts/droid_review/plan_shards.py "$MAX_FILES" "$MAX_COUNT" < code_files.txt)
            echo "Plan output: $PLAN"
            echo "shards=$(echo "$PLAN" | jq -c '.shards')" >> "$GITHUB_OUTPUT"
          else
            echo "shards=[]" >> "$GITHUB_OUTPUT"
          fi
          # Save file statuses for shard scripts (deleted files need special handling)
          cp changed_files_with_status.txt /tmp/file_statuses.txt

      - name: Upload file statuses
        if: always() && steps.docs_only.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: file-statuses-${{ github.run_id }}
          path: /tmp/file_statuses.txt
          retention-days: 1

  # ── Job 2: Review shard matrix (parallel, model call) ──
  review-shard:
    needs: plan-shards
    if: >-
      needs.plan-shards.outputs.docs_only != 'true' &&
      needs.plan-shards.outputs.shards != '[]' &&
      needs.plan-shards.outputs.shards != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.SHARD_MAX_PARALLEL || '3') }}
      matrix:
        shard: ${{ fromJSON(needs.plan-shards.outputs.shards) }}
    env:
      NVIDIA_KONG_PROXY_KEY: ${{ secrets.NVIDIA_KONG_PROXY_KEY }}
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - name: Checkout repository (BASE)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Checkout PR head (HEAD → head-src/)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: head-src

      - name: Set shard environment
        id: shard_env
        env:
          SHARD_FILES_JSON: ${{ toJson(matrix.shard.files) }}
          SHARD_ID_VAL: ${{ matrix.shard.shard_id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          # Fix #1: Write SHARD_FILES without literal quote wrapping
          # Use jq -cn --argjson to produce clean JSON into GITHUB_ENV
          # (Previous version wrapped in literal single quotes that broke jq parsing)
          {
            echo "SHARD_ID=$SHARD_ID_VAL"
            echo "BASE_REF=$BASE_SHA"
            echo "HEAD_REF=$HEAD_SHA"
            echo "RUN_ID=${{ github.run_id }}"
            echo "SHARD_FILES='$SHARD_FILES_JSON'"
          } >> "$GITHUB_ENV"

          # Fix #2: Compute merge-base within head-src after fetching base SHA
          # (Previous version computed merge-base against origin/base.ref which
          # may not be fetched in head-src clone, and || true swallowed errors)
          cd head-src
          git config --global --add safe.directory "$GITHUB_WORKSPACE/head-src"

          # Fetch the base SHA explicitly so merge-base can resolve it
          git fetch origin "$BASE_SHA" --depth=1 2>/dev/null || true

          # Compute merge-base — fail-closed (no || true)
          MERGE_BASE=$(git merge-base HEAD "$BASE_SHA")
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::Failed to compute merge-base between HEAD and $BASE_SHA"
            exit 1
          fi
          echo "MERGE_BASE=$MERGE_BASE" >> "$GITHUB_ENV"
          echo "Merge base: $MERGE_BASE"
          cd "$GITHUB_WORKSPACE"

      - name: Write BYOM settings file
        run: |
          mkdir -p ~/.factory
          cat > ~/.factory/settings.json << 'SETTINGS_EOF'
          {
            "customModels": [
              {
                "model": "qwen3.7-plus",
                "displayName": "Bailian Qwen 3.7 Plus",
                "baseUrl": "https://ai.exa.edu.kg/v1",
                "apiKey": "${NVIDIA_KONG_PROXY_KEY}",
                "provider": "generic-chat-completion-api",
                "maxOutputTokens": 65536,
                "noImageSupport": true
              }
            ]
          }
          SETTINGS_EOF
          echo "BYOM settings written to ~/.factory/settings.json"
          python3 -c "import json; json.load(open('$HOME/.factory/settings.json')); print('JSON validation passed')"

      - name: Pre-check credentials
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          echo "Verifying Factory API credentials before review..."
          if [ -z "$FACTORY_API_KEY" ]; then
            echo "::error::FACTORY_API_KEY secret is empty or not configured."
            exit 1
          fi
          echo "Secret is present (length: ${#FACTORY_API_KEY} chars)."

      - name: Run shard review
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          chmod +x scripts/droid_review/run_shard.sh
          bash scripts/droid_review/run_shard.sh

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droid-review-debug-${{ github.run_id }}-shard-${{ matrix.shard.shard_id }}
          path: |
            findings-shard-*.json
            shard-*.diff
            ~/.factory/sessions/**
            prompt.md
            shard-env.log
          retention-days: 7

  # ── Job 3: Aggregate and publish findings ──
  droid-review:
    needs: [plan-shards, review-shard]
    if: always() && needs.plan-shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.DROID_REVIEW_TIMEOUT_MINUTES || '90') }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository (BASE)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Check shard results
        id: check_results
        run: |
          set -eu
          DOCS_ONLY="${{ needs.plan-shards.outputs.docs_only }}"
          SHARDS="${{ needs.plan-shards.outputs.shards }}"

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "docs-only PR — skipping aggregation"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$SHARDS" = "[]" ] || [ -z "$SHARDS" ]; then
            echo "no shards planned — skipping aggregation"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if any review-shard job failed
          if [ "${{ needs.review-shard.result }}" != "success" ] && [ "${{ needs.review-shard.result }}" != "skipped" ]; then
            echo "::error::review-shard job failed — fail-closed"
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Download findings artifacts
        if: steps.check_results.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: droid-review-debug-${{ github.run_id }}-shard-*
          path: findings/

      - name: Publish findings
        if: steps.check_results.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          python3 scripts/droid_review/publish_findings.py \
            --pattern "findings/*/findings-shard-*.json" \
            --pr-number "$PR_NUMBER" \
            --repository "$REPOSITORY"
