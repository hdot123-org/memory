# Evolution Scanner thin caller（M4 切换，architecture.md §6）
# 文件名必须保留 evolution-scan.yml——heartbeat 引擎按
# SCANNER_WORKFLOW = "evolution-scan.yml" 经 gh run list --workflow 解析扫描器存活。
#
# 本文件保留（契约断言面，VAL-GATE-108/113）：workflow 名 'Evolution Scan'、
# schedule cron（INFRA-578 错峰分钟位）、workflow_dispatch、concurrency、
# secrets 显式转发。scan 执行体（per-run venv / pip install -e . /
# Generate error patterns（infra-core 入口）/ evolution-history cache /
# label-ensure / scanner 运行）委托 infra-core reusable——
# 模板契约由 infra-core 侧 test_evolution_scan_heartbeat_workflow.py 锁定。
#
# CRITICAL TOKEN STRATEGY: DISPATCH_TOKEN（PAT，author=hdot123）经
# secrets 显式传入 reusable；Issue author 满足 CODEOWNERS/governance。
#
# INFRA-578: cron 分钟位避开 :00/:30（GitHub 高峰 load-shed drop 窗口）。
# INFRA-588: heartbeat 自身被 drop 时，扫描器 watch_heartbeat_channel
# （infra-core 引擎）会 workflow_dispatch 反向拉起 evolution-heartbeat.yml。

name: Evolution Scan

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

concurrency:
  group: evolution-scan
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    uses: hdot123-org/infra-core/.github/workflows/evolution-scan.yml@main
    permissions:
      contents: read
      issues: write
    secrets:
      # snake_case 单形态（M5 R1(3) 终态，对齐 infra-core #82）：双形态同名
      # 提供（-/_ 归一化）即重复键 → run startup_failure（2026-08-30 实测）。
      dispatch_token: ${{ secrets.DISPATCH_TOKEN }}
      linear_api_key: ${{ secrets.LINEAR_API_KEY }}
