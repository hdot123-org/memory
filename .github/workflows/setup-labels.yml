# Setup Labels - Thin Caller (M4, INFRA-583)
# Calls the infra-core reusable workflow for label creation.
# Naming contract: workflow name must be exactly "Setup Labels".

name: Setup Labels

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-labels:
    name: create-labels
    uses: hdot123-org/infra-core/.github/workflows/setup-labels.yml@main
    # No labels-json input → reusable workflow uses default label set
