# Evolution Governance - Thin Caller
# Calls infra-core composite action for governance check.
# Naming contract: workflow name must be exactly "Evolution Governance".
# Job display name must be exactly "Block non-owner governance modifications"
# (branch protection required check — third context).

name: Evolution Governance

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-check:
    name: Block non-owner governance modifications
    # INFRA-569 安全边界：pull_request_target + secrets 的 job 必须保持 GitHub-hosted，
    # 自建 runner 对 PR 代码是持久化多租户环境，会扩大攻击面。
    runs-on: ubuntu-latest
    steps:
      - name: Governance check
        uses: hdot123-org/infra-core/actions/governance-check@v0.12.1
        with:
          owner-login: hdot123
          # memory-core 四类保护路径（与切换前内联 grep 模式全集对等）
          protected-patterns: '.evolution/**,scripts/**,.github/workflows/evolution-*.yml,.github/CODEOWNERS'
          github-token: ${{ secrets.GITHUB_TOKEN }}
