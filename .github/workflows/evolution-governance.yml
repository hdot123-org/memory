# Evolution Governance CI Check
# Blocks PRs that modify evolution governance paths unless authored by @busiji.
# This prevents bots (including Droid) from modifying their own governance rules.

name: Evolution Governance

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-check:
    name: Block non-owner governance modifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for protected path modifications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          # Get list of changed files via GitHub API (not git diff, which is empty with pull_request_target)
          # Fail-closed: if API call fails, exit with error instead of silently passing governance
          if ! CHANGED=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --field per_page=100 --jq '.[].filename' 2>&1); then
            echo "ERROR: Failed to fetch PR changed files via API:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi

          if [ -z "$CHANGED" ]; then
            echo "No changed files detected, skipping governance check"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Check if PR touches protected paths
          TOUCHED_PROTECTED=false

          # Check .evolution/config.yml
          if echo "$CHANGED" | grep -q "^\.evolution/config\.yml$"; then
            echo "PROTECTED: .evolution/config.yml modified"
            TOUCHED_PROTECTED=true
          fi

          # Check scripts/evolution_scanner.py
          if echo "$CHANGED" | grep -q "^scripts/evolution_scanner\.py$"; then
            echo "PROTECTED: scripts/evolution_scanner.py modified"
            TOUCHED_PROTECTED=true
          fi

          # Check scripts/evolution_adapters.py
          if echo "$CHANGED" | grep -q "^scripts/evolution_adapters\.py$"; then
            echo "PROTECTED: scripts/evolution_adapters.py modified"
            TOUCHED_PROTECTED=true
          fi

          # Check scripts/evolution_utils.py
          if echo "$CHANGED" | grep -q "^scripts/evolution_utils\.py$"; then
            echo "PROTECTED: scripts/evolution_utils.py modified"
            TOUCHED_PROTECTED=true
          fi

          # Check .github/workflows/evolution-*.yml
          if echo "$CHANGED" | grep -q "^\.github/workflows/evolution-.*\.yml$"; then
            echo "PROTECTED: evolution workflow file modified"
            TOUCHED_PROTECTED=true
          fi

          if [ "$TOUCHED_PROTECTED" = "true" ]; then
            echo ""
            echo "PR author: $PR_AUTHOR"
            if [ "$PR_AUTHOR" != "busiji" ]; then
              echo ""
              echo "ERROR: Non-owner ($PR_AUTHOR) cannot modify evolution governance paths."
              echo "Protected paths: .evolution/config.yml, scripts/evolution_scanner.py, scripts/evolution_adapters.py, scripts/evolution_utils.py, .github/workflows/evolution-*.yml"
              echo "Only @busiji is authorized to modify these files."
              exit 1
            else
              echo "OK: Owner (@busiji) modifying governance paths"
            fi
          else
            echo "No protected paths modified, governance check passed"
          fi
