# Evolution Governance - Thin Caller
# Calls infra-core composite action for governance check.
# Naming contract: workflow name must be exactly "Evolution Governance".
# Job display name must be exactly "Block non-owner governance modifications"
# (branch protection required check — third context).

name: Evolution Governance

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-check:
    name: Block non-owner governance modifications
    runs-on: [self-hosted, pve-linux]
    steps:
      - name: Governance check
        uses: hdot123-org/infra-core/actions/governance-check@main
        with:
          owner-login: hdot123
          # memory-core 五类保护路径（与切换前内联 grep 模式全集对等）
          protected-patterns: '.evolution/**,scripts/evolution_*.py,scripts/**,.github/workflows/evolution-*.yml,.github/CODEOWNERS'
          github-token: ${{ secrets.GITHUB_TOKEN }}
