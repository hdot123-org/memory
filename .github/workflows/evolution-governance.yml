# Evolution Governance CI Check
# Blocks PRs that modify evolution governance paths unless authored by @hdot123.
# This prevents bots (including Droid) from modifying their own governance rules.

name: Evolution Governance

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-check:
    name: Block non-owner governance modifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for protected path modifications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          # Get list of changed files via GitHub API (not git diff, which is empty with pull_request_target)
          # Fail-closed: if API call fails, exit with error instead of silently passing governance
          # --method GET is explicit because --field would switch gh api to POST (which 404s on this endpoint)
          # per_page goes in the URL query string, NOT as --field (which also triggers POST)
          # P2-4: Also get previous_filename to detect file renames
          if ! CHANGED=$(gh api --method GET "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --paginate --jq '.[] | .filename, (.previous_filename // empty)' 2>&1); then
            echo "ERROR: Failed to fetch PR changed files via API:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi

          if [ -z "$CHANGED" ]; then
            echo "No changed files detected, skipping governance check"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Check if PR touches protected paths
          TOUCHED_PROTECTED=false

          # Check entire .evolution/ directory (config, kill switch, history, etc.)
          if echo "$CHANGED" | grep -q "^\.evolution/"; then
            echo "PROTECTED: .evolution/ directory modified"
            TOUCHED_PROTECTED=true
          fi

          # Check scripts/evolution_*.py (all evolution scripts)
          if echo "$CHANGED" | grep -q "^scripts/evolution_.*\.py$"; then
            echo "PROTECTED: evolution scanner script modified"
            TOUCHED_PROTECTED=true
          fi

          # Check .github/workflows/evolution-*.yml
          if echo "$CHANGED" | grep -q "^\.github/workflows/evolution-.*\.yml$"; then
            echo "PROTECTED: evolution workflow file modified"
            TOUCHED_PROTECTED=true
          fi

          # Check .github/CODEOWNERS (defines who can review governance changes)
          if echo "$CHANGED" | grep -q "^\.github/CODEOWNERS$"; then
            echo "PROTECTED: CODEOWNERS file modified"
            TOUCHED_PROTECTED=true
          fi

          if [ "$TOUCHED_PROTECTED" = "true" ]; then
            echo ""
            echo "PR author: $PR_AUTHOR"
            if [ "$PR_AUTHOR" != "hdot123" ]; then
              echo ""
              echo "ERROR: Non-owner ($PR_AUTHOR) cannot modify evolution governance paths."
              echo "Protected paths: .evolution/ (all files), scripts/evolution_*.py, .github/workflows/evolution-*.yml, .github/CODEOWNERS"
              echo "Only @hdot123 is authorized to modify these files."
              exit 1
            else
              echo "OK: Owner (@hdot123) modifying governance paths"
            fi
          else
            echo "No protected paths modified, governance check passed"
          fi
