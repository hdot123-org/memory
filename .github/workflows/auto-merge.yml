name: Auto Merge

on:
  check_run:
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to merge'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_PRS: ${{ toJSON(github.event.check_run.pull_requests) }}
          MANUAL_PR: ${{ github.event.inputs.pr_number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [ -n "$PR_NUMBER" ] && echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "check_run" ]; then
            NUM=$(echo "$CHECK_PRS" | jq -r ".[0].number // empty")
            [ -n "$NUM" ] && echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_PR" ]; then
            echo "pr_number=$MANUAL_PR" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            # On schedule, find the first open PR from whitelist authors
            PR=$(gh pr list --repo "$REPO" --state open --json number,author --jq '[.[] | select(.author.login == "hdot123" or .author.login == "app/github-actions" or .author.login == "dependabot[bot]")] | .[0].number // empty' 2>/dev/null || true)
            [ -n "$PR" ] && echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Run auto-merge
        if: steps.resolve.outputs.pr_number != ''
        uses: hdot123/shared-workflows/auto-merge@main
        with:
          pr-number: ${{ steps.resolve.outputs.pr_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
