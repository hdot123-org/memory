name: Auto Merge

on:
  check_run:
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to merge'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          CHECK_PRS: ${{ toJSON(github.event.check_run.pull_requests) }}
          CHECK_SHA: ${{ github.event.check_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          PR=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR="$DISPATCH_PR"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            PR="$PR_NUMBER"
          elif [ "$EVENT_NAME" = "check_run" ]; then
            PR=$(echo "$CHECK_PRS" | jq -r '.[0].number // empty')
            if [ -z "$PR" ] && [ -n "$CHECK_SHA" ]; then
              PR=$(gh api "repos/$REPO/commits/$CHECK_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
            fi
          fi
          if [ -n "$PR" ]; then
            echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          fi

      - name: Run auto-merge
        if: steps.resolve.outputs.pr_number != ''
        uses: hdot123/shared-workflows/auto-merge@main
        with:
          pr-number: ${{ steps.resolve.outputs.pr_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
