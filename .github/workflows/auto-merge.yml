name: Auto Merge

# M4 门禁切换（gate-watchdog-automerge）：本文件为 thin caller——触发面 + 事件门控
# + concurrency 留在本地（github 事件上下文只在 caller 求值，VAL-GATE-106 契约），
# resolve + triage + merge 执行体委托 infra-core reusable workflow
# （auto-merge-pipeline.yml@main，shared-workflows merge pin 在引擎仓冻结不动）。
#
# 为什么用 workflow_run + schedule 而非 check_run（INFRA-212）
# ----------------------------------------------------------------
# GitHub 为防止递归调用，不会把 check_run / check_suite 事件投递给其他
# workflow——只要该 check 由 GitHub Actions 工作流产生。本仓库的 CI、QA、
# droid-review、evolution-governance 全部是 GitHub Actions 工作流，因此
# check_run: completed 实际上永远不会触发，导致 CI 全绿后 PR 不自动合并，
# 只能靠手动 workflow_dispatch。
#
# 正确做法：
#   1. workflow_run       —— 上游工作流成功结束时触发（快速路径）
#   2. schedule           —— 每 10 分钟扫描兜底，保证任何遗漏事件都能收敛
#   3. pull_request_target —— PR 打开/更新时立即尝试一次
#   4. workflow_dispatch   —— 手动触发（不指定 PR 号则扫描全部 open PR）
#
# 零红铁律（2026-08-28 用户裁定，执行体在 infra-core reusable 内实施）：
#   全绿判定 = PR head 全部 check-runs 零 fail（含 advisory 层）。
#   triage 的 statusCheckRollup 全 SUCCESS/SKIPPED/NEUTRAL 判定 + shared-workflows
#   auto-merge action 的全 check-runs 扫描双层保证。不得只查 required contexts。
on:
  workflow_run:
    workflows: ["CI", "QA", "Droid Auto Review", "Evolution Governance"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to merge (empty = sweep all open PRs)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

# INFRA-428：收敛并发扫。schedule 每 10 分钟 + workflow_run 事件可能让
# 同一 PR 被两条腿同时处理（update-branch 双发、冲突评论 TOCTOU 双发）。
# 组级排队不取消进行中的腿（cancel 会打断正在合并的腿），只保证同一时刻
# 至多一条 Auto Merge 流水在处理，竞态窗口自然消失。
concurrency:
  group: auto-merge-pipeline
  cancel-in-progress: false

jobs:
  auto-merge:
    # 事件门控归 caller：workflow_run 只有在结论为 success 时才尝试合并；
    # 其余事件各自自行门控。执行体（resolve/triage/behind/conflicting/stalled/
    # merge）在 infra-core auto-merge-pipeline.yml（其模板测试锁定 shared-workflows
    # pin 与零红判定；防毒：零 checkout + RUNNER_TEMP heredoc triage）。
    # 调用 job 权限 = callee 所需集合（contents/pull-requests/checks，startup
    # 子集校验，缺声明即 startup_failure 零 job——INFRA-613 教训）。
    if: |
      github.event_name == 'pull_request_target' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    uses: hdot123-org/infra-core/.github/workflows/auto-merge-pipeline.yml@main
    permissions:
      contents: write
      pull-requests: write
      checks: read
    secrets:
      # 铁律：合并必须用 DISPATCH_TOKEN（PAT，不受 GitHub 递归防护抑制），
      # 不能用 GITHUB_TOKEN——GITHUB_TOKEN 触发的 push 事件被抑制会导致
      # release-please 监听的 push(paths: .release-please-manifest.json) 失效，
      # release PR 合并后 tag/Release 不创建（2026-08-15 两次事故 v0.29.0/v0.30.0）。
      # snake_case 为统一命名形态（M5 R1(3)）；hyphen 为过渡期兼容双写，
      # infra-core reusable 切换后由后续 PR 移除（与 #1075 同批口径）。
      dispatch_token: ${{ secrets.DISPATCH_TOKEN }}
      dispatch-token: ${{ secrets.DISPATCH_TOKEN }}
