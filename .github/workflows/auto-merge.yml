name: Auto Merge

# 为什么用 workflow_run + schedule 而非 check_run（INFRA-212）
# ----------------------------------------------------------------
# GitHub 为防止递归调用，不会把 check_run / check_suite 事件投递给其他
# workflow——只要该 check 由 GitHub Actions 工作流产生。本仓库的 CI、QA、
# droid-review、evolution-governance 全部是 GitHub Actions 工作流，因此
# check_run: completed 实际上永远不会触发，导致 CI 全绿后 PR 不自动合并，
# 只能靠手动 workflow_dispatch。
#
# 正确做法：
#   1. workflow_run       —— 上游工作流成功结束时触发（快速路径）
#   2. schedule           —— 每 10 分钟扫描兜底，保证任何遗漏事件都能收敛
#   3. pull_request_target —— PR 打开/更新时立即尝试一次
#   4. workflow_dispatch   —— 手动触发（不指定 PR 号则扫描全部 open PR）
on:
  workflow_run:
    workflows: ["CI", "QA", "Droid Auto Review", "Evolution Governance"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to merge (empty = sweep all open PRs)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  resolve:
    name: Resolve candidate PRs
    runs-on: ubuntu-latest
    # workflow_run 只有在结论为 success 时才尝试合并；其余事件各自自行门控。
    if: |
      github.event_name == 'pull_request_target' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      pr_numbers: ${{ steps.resolve.outputs.pr_numbers }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_PR: ${{ github.event.inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          echo "Event: $EVENT_NAME"
          case "$EVENT_NAME" in
            pull_request_target)
              if [ -n "$PR_NUMBER" ]; then
                echo "pr_numbers=[\"$PR_NUMBER\"]" >> "$GITHUB_OUTPUT"
              fi
              ;;
            workflow_dispatch)
              if [ -n "$MANUAL_PR" ]; then
                echo "pr_numbers=[\"$MANUAL_PR\"]" >> "$GITHUB_OUTPUT"
              else
                # 未指定 PR 号：扫描所有 open PR
                PRS=$(gh pr list --repo "$REPO" --state open --json number --jq '[.[].number]')
                echo "pr_numbers=$PRS" >> "$GITHUB_OUTPUT"
              fi
              ;;
            workflow_run)
              # 按完成工作流的 head SHA 反查关联的 open PR
              PRS=$(gh pr list --repo "$REPO" --state open --json number,headRefOid \
                    --jq "[.[] | select(.headRefOid == \"$WR_HEAD_SHA\") | .number]")
              echo "pr_numbers=$PRS" >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              PRS=$(gh pr list --repo "$REPO" --state open --json number --jq '[.[].number]')
              echo "pr_numbers=$PRS" >> "$GITHUB_OUTPUT"
              ;;
          esac

  auto-merge:
    name: Auto-merge PR
    needs: resolve
    if: needs.resolve.outputs.pr_numbers != '' && needs.resolve.outputs.pr_numbers != '[]'
    runs-on: ubuntu-latest
    # INFRA-416：限定单腿时长。triage 各分支都是有界 API 调用，10 分钟
    # 足够；防止 gh/网络挂死导致 matrix 腿永久占位（schedule 每 10 分钟
    # 一轮，旧腿不退出会与新腿堆叠）。
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pr_number: ${{ fromJSON(needs.resolve.outputs.pr_numbers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/auto_merge_triage.sh
          sparse-checkout-cone-mode: false

      - name: Triage PR mergeable state
        id: triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -eu
          # 获取 PR 的 mergeable 状态。
          # mergeable 由 GitHub 异步计算：push 后短暂为 UNKNOWN 属正常。
          # INFRA-416 竞态守卫：resolve 与本步之间 PR 可能已被并行腿合并
          # （matrix max-parallel=5），gh pr view 失败（NotFound）时降级为
          # skip 而非红腿；仅凭状态取不到（非 NotFound 的 API 故障）才 fail。
          PR_DATA=""
          for attempt in 1 2 3; do
            if PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json number,mergeable,mergeStateStatus 2>&1); then
              break
            fi
            if echo "$PR_DATA" | grep -q "not found\|Could not resolve"; then
              echo "PR #$PR_NUMBER no longer accessible (merged/closed by a parallel leg). Skipping."
              echo "action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "gh pr view attempt $attempt failed: $PR_DATA"
            PR_DATA=""
            sleep 5
          done
          if [ -z "$PR_DATA" ]; then
            echo "::error::Could not fetch PR #$PR_NUMBER state after 3 attempts"
            exit 1
          fi
          echo "PR data: $PR_DATA"

          # mergeable=UNKNOWN：GitHub 尚未算完。等待后重取一次（通常几秒
          # 内出结果）；仍 UNKNOWN 则 skip，交给 schedule 兜底收敛，
          # 绝不在未知状态猜测动作。
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          if [ "$MERGEABLE" = "UNKNOWN" ]; then
            sleep 10
            PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json number,mergeable,mergeStateStatus)
            echo "PR data after UNKNOWN retry: $PR_DATA"
          fi

          # 分类并提取该 PR 的动作（单 PR 输入，--get-action 即其 action）
          ACTION=$(echo "$PR_DATA" | jq -s '.[0:1]' | bash scripts/auto_merge_triage.sh --get-action "$PR_NUMBER")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Action: $ACTION"

      - name: Handle BEHIND PR (update-branch self-heal)
        if: steps.triage.outputs.action == 'update-branch'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -eu
          echo "::warning::PR #$PR_NUMBER is BEHIND main, attempting update-branch self-heal"
          # 幂等操作：更新 PR 分支以包含最新 main
          gh pr update-branch "$PR_NUMBER" --repo "$REPO" || {
            echo "::error::update-branch failed for PR #$PR_NUMBER"
            exit 1
          }
          echo "PR #$PR_NUMBER branch updated, CI will re-run and trigger new workflow_run event"

      - name: Handle CONFLICTING PR (notify)
        if: steps.triage.outputs.action == 'notify'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -eu
          echo "::error::PR #$PR_NUMBER has merge conflicts (CONFLICTING state)"
          # 幂等通知（INFRA-416）：按 head SHA 粒度去重——同一 head SHA 只发
          # 一次冲突评论，避免 schedule 每 10 分钟重复刷屏（INFRA-292 教训）。
          # sentinel 随冲突解决后的新 push 自然轮换，无需人工清理。
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          SENTINEL="<!-- auto-merge-conflict-${HEAD_SHA} -->"
          EXISTING=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments --jq '[.comments[].body | select(contains("'"$SENTINEL"'"))] | length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Conflict comment already posted for $HEAD_SHA (count: $EXISTING). Skipping duplicate notification."
            exit 1
          fi
          # 添加评论通知 PR 作者（用 heredoc 避免多行中文字符串破坏 YAML）
          read -r -d '' COMMENT_BODY <<'COMMENT_EOF' || true
          ⚠️ **Auto-merge: PR 存在合并冲突（CONFLICTING 状态）**

          此 PR 无法自动合并，需要手动解决冲突：
          1. 拉取最新 main 并合并
          2. 解决冲突并推送
          3. 推送后 auto-merge 会自动重试

          COMMENT_EOF
          COMMENT_BODY="${COMMENT_BODY}${SENTINEL}"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$COMMENT_BODY"
          # 失败退出，让 workflow 显示红色告警
          exit 1

      - name: Run auto-merge
        if: steps.triage.outputs.action == 'merge'
        uses: hdot123-org/shared-workflows/auto-merge@5a0fc1b8946a170a12687d8614d56189e1f8dab5
        with:
          pr-number: ${{ matrix.pr_number }}
        env:
          # 铁律：合并必须用 DISPATCH_TOKEN，不能用 GITHUB_TOKEN。
          # GitHub 递归防护会抑制 GITHUB_TOKEN 操作产生的 push 事件，
          # 导致 release-please 的 push(paths: .release-please-manifest.json)
          # 触发器失效 → release PR 合并后 tag/Release 不创建、Release Pipeline 断链。
          # 2026-08-15 两次事故（v0.29.0 / v0.30.0 均靠手动 dispatch 补救）。
          GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
