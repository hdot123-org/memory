name: Branch Cleanup

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for branch inspection

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete orphan branches
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Determine mode based on trigger event
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR-close trigger: immediate cleanup of the merged branch only
            bash scripts/branch_cleanup.sh --immediate "$TRIGGER_BRANCH" | tee /tmp/branch_cleanup_output.txt
          else
            # Scheduled trigger: sweep all orphan branches
            bash scripts/branch_cleanup.sh --scheduled | tee /tmp/branch_cleanup_output.txt
          fi

          # Parse script output and set environment variables
          DELETED_COUNT=$(grep '^deleted_count=' /tmp/branch_cleanup_output.txt | cut -d'=' -f2)
          PROTECTED_COUNT=$(grep '^protected_count=' /tmp/branch_cleanup_output.txt | cut -d'=' -f2)

          echo "deleted_count=${DELETED_COUNT:-0}" >> "$GITHUB_ENV"
          echo "protected_count=${PROTECTED_COUNT:-0}" >> "$GITHUB_ENV"

          # Extract deleted branch names for issue notification
          if [ "${DELETED_COUNT:-0}" -gt 0 ]; then
            awk '/^Deleted .* branch\(es\):$/,/^$/' /tmp/branch_cleanup_output.txt | grep -v '^Deleted' | grep -v '^$' > /tmp/deleted_branches.txt || true
          fi

          # Extract protected branch names for issue notification
          if [ "${PROTECTED_COUNT:-0}" -gt 0 ]; then
            awk '/^Protected .* branch\(es\) with unmerged/,/^$/' /tmp/branch_cleanup_output.txt | grep -v '^Protected' | grep -v '^$' > /tmp/protected_branches.txt || true
          fi

      - name: Create issue notification
        if: env.deleted_count != '0' || env.protected_count != '0'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          DELETED_COUNT="${{ env.deleted_count }}"
          PROTECTED_COUNT="${{ env.protected_count }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          # Build issue body
          {
            echo "## Automated Branch Cleanup"
            echo ""
            echo "**Run date:** $RUN_DATE"
            echo "**Deleted branches:** $DELETED_COUNT"
            echo "**Protected branches:** $PROTECTED_COUNT"
            echo "**Workflow run:** $RUN_URL"
            echo ""

            if [ "$DELETED_COUNT" -gt 0 ]; then
              echo "### Deleted branches"
              echo ""
              while IFS= read -r branch; do
                echo "- \`$branch\`"
              done < /tmp/deleted_branches.txt
              echo ""
            fi

            if [ "$PROTECTED_COUNT" -gt 0 ]; then
              echo "### 🛡️ Protected branches (unmerged unique commits)"
              echo ""
              echo "These branches were protected from deletion because they contain unique commits not in main and their PR was closed without merging:"
              echo ""
              while IFS= read -r branch; do
                echo "- \`$branch\`"
              done < /tmp/protected_branches.txt
              echo ""
            fi

            echo "---"
            echo "*This issue was automatically created by the [Branch Cleanup]($RUN_URL) workflow.*"
          } > /tmp/issue_body.md

          # Ensure labels exist (idempotent)
          gh label create automation --force 2>/dev/null || true
          gh label create branch-cleanup --force 2>/dev/null || true

          # Build dynamic title
          TITLE_PARTS="Branch cleanup:"
          if [ "$DELETED_COUNT" -gt 0 ]; then
            TITLE_PARTS="$TITLE_PARTS $DELETED_COUNT deleted"
          fi
          if [ "$PROTECTED_COUNT" -gt 0 ]; then
            TITLE_PARTS="$TITLE_PARTS $PROTECTED_COUNT protected"
          fi
          TITLE="$TITLE_PARTS ($RUN_DATE)"

          # Create issue
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/issue_body.md \
            --label "automation,branch-cleanup"
