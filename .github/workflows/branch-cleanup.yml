name: Branch Cleanup

on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *'  # Every 5h at UTC 00/05/10/15/20 (Beijing 08/13/18/23/04) - avoids Beijing 14:00-18:00 peak hours
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for branch inspection

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete orphan branches
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Determine mode based on trigger event
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR-close trigger: immediate cleanup of the merged branch only
            bash scripts/branch_cleanup.sh --immediate "$TRIGGER_BRANCH" | tee /tmp/branch_cleanup_output.txt
          else
            # Scheduled trigger: sweep all orphan branches
            bash scripts/branch_cleanup.sh --scheduled | tee /tmp/branch_cleanup_output.txt
          fi

          # Parse script output and set environment variables
          DELETED_COUNT=$(grep '^deleted_count=' /tmp/branch_cleanup_output.txt | cut -d'=' -f2)
          PROTECTED_COUNT=$(grep '^protected_count=' /tmp/branch_cleanup_output.txt | cut -d'=' -f2)

          echo "deleted_count=${DELETED_COUNT:-0}" >> "$GITHUB_ENV"
          echo "protected_count=${PROTECTED_COUNT:-0}" >> "$GITHUB_ENV"

          # Extract deleted branch names for issue notification
          if [ "${DELETED_COUNT:-0}" -gt 0 ]; then
            awk '/^Deleted .* branch\(es\):$/,/^$/' /tmp/branch_cleanup_output.txt | grep -v '^Deleted' | grep -v '^$' > /tmp/deleted_branches.txt || true
          fi

          # Extract protected branch names for issue notification
          if [ "${PROTECTED_COUNT:-0}" -gt 0 ]; then
            awk '/^Protected .* branch\(es\) with unmerged/,/^$/' /tmp/branch_cleanup_output.txt | grep -v '^Protected' | grep -v '^$' > /tmp/protected_branches.txt || true
          fi

      - name: Manage tracking issue (INFRA-385 dedup)
        # Always run this step: when nothing was deleted/protected it closes
        # the now-resolved tracking issue; otherwise it creates/updates the
        # single tracking issue instead of opening one issue per run.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          GH_REPO_KEY: ${{ github.repository }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          # Ensure list files exist (empty lists are valid)
          touch /tmp/deleted_branches.txt /tmp/protected_branches.txt

          bash scripts/branch_cleanup_issue.sh \
            --deleted /tmp/deleted_branches.txt \
            --protected /tmp/protected_branches.txt \
            --run-url "$RUN_URL" \
            --run-date "$RUN_DATE"
