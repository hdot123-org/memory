name: Evolution Heartbeat

on:
  schedule:
    # INFRA-578: 分钟位避开 :00（GitHub Actions 高峰负载削减窗口）。
    # 实证 2026-08-26：整点触发的 cron 间隔从 2h 名义值漂移到 2h18m+，
    # 非高峰分钟显著降低被 drop 概率。
    - cron: '47 */2 * * *'  # Every 2 hours at minute 47 (off-peak)
  workflow_dispatch: {}

concurrency:
  group: evolution-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package
        run: pip install -e .
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh label create "evolution-heartbeat" --color D93F0B --description "Evolution heartbeat alert" --force || true
      - name: Run heartbeat check
        run: python scripts/evolution_heartbeat.py
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PYTHONSAFEPATH: '1'
