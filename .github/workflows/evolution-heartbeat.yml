# Evolution Heartbeat thin caller（M4 切换，architecture.md §6）
# 本文件保留（契约断言面）：workflow 名 'Evolution Heartbeat'、
# schedule cron '47 */2 * * *'（INFRA-578 错峰）、workflow_dispatch、
# concurrency、DISPATCH_TOKEN 显式转发。heartbeat 执行体（label-ensure
# evolution-heartbeat / python -m infra_core.engine.evolution_heartbeat）
# 委托 infra-core reusable。
#
# SCANNER_WORKFLOW 契约：引擎常量 SCANNER_WORKFLOW = "evolution-scan.yml"
# 指本仓文件名不变——gh run list --workflow 按文件名解析，扫描器切换后
# heartbeat 仍能判定扫描器存活（VAL-GATE-109）。
# INFRA-588: 本 workflow 被 drop 时，扫描器 watch_heartbeat_channel 反向拉起。

name: Evolution Heartbeat

on:
  schedule:
    - cron: '47 */2 * * *'  # Every 2 hours at minute 47 (off-peak, INFRA-578)
  workflow_dispatch: {}

concurrency:
  group: evolution-heartbeat
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  heartbeat:
    uses: hdot123-org/infra-core/.github/workflows/evolution-heartbeat.yml@main
    permissions:
      contents: read
      issues: write
    secrets:
      # snake_case 单形态（M5 R1(3) 终态，对齐 infra-core #82）：双形态同名
      # 提供（-/_ 归一化）即重复键 → run startup_failure（2026-08-30 实测）。
      dispatch_token: ${{ secrets.DISPATCH_TOKEN }}
