# INFRA-569：按运行隔离的 venv 引导（composite action）
#
# 动机（2026-08-25 教训 selfhosted-runner-env-shadowing）：
# 1. 自建 runner 的 site-packages 存在 pip install -e 管不到的旧包残留
#    （部署链路/快照预装来源），环境遮蔽导致 CI 版本断言假失败；
# 2. pip --user 装进 ~/.local 会跨 run 残留半装状态，rerun 时毒化新 run。
#
# 本 action 在 $RUNNER_TEMP 下按 run_id + run_attempt 创建一次性 venv 并
# 前置到 PATH（含 VIRTUAL_ENV），job 结束由 runner 自动清理——每次运行
# 从零解析依赖，rerun 不共享旧状态。
#
# 前置要求：调用 job 已 checkout（本 action 不读仓库文件）；系统 python3 为 3.12
#（pyproject requires-python ==3.12.*，pve runner 预装）。
# 回退分支：镜像缺 python3-venv（ensurepip）时 --without-pip + get-pip 引导。
# 本地 action 无 marketplace 下载——慢隧道下 job 启动阶段零额外开销。
# shellcheck 洁净：GitHub 表达式经 env 传入（SC2296：${{ }}} 不能进脚本内联）。
name: "Setup isolated venv (per-run)"
description: "Create a per-run isolated venv under RUNNER_TEMP and prepend it to PATH (INFRA-569)"
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -eu
        VENV="$RUNNER_TEMP/venv-${RUN_ID}-${RUN_ATTEMPT}"
        rm -rf "$VENV"
        if ! python3 -m venv "$VENV" 2>"$RUNNER_TEMP/venv-err.log"; then
          echo "::warning::python3 -m venv failed (ensurepip missing?), falling back to --without-pip + get-pip"
          cat "$RUNNER_TEMP/venv-err.log" || true
          rm -rf "$VENV"
          python3 -m venv --without-pip "$VENV"
          if command -v curl >/dev/null; then
            curl --retry 3 --retry-delay 5 --retry-all-errors -fsSL \
              -o "$RUNNER_TEMP/get-pip.py" https://bootstrap.pypa.io/get-pip.py
          else
            wget -q -O "$RUNNER_TEMP/get-pip.py" https://bootstrap.pypa.io/get-pip.py
          fi
          "$VENV/bin/python" "$RUNNER_TEMP/get-pip.py" --disable-pip-version-check
        fi
        echo "$VENV/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$VENV" >> "$GITHUB_ENV"
        "$VENV/bin/python" --version
        "$VENV/bin/python" -m pip --version
