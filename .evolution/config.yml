# Human-maintained governance config. Scanner reads only, never writes.
max_issues_per_tick: 1
max_self_audit_issues_per_tick: 1
max_code_hygiene_issues_per_tick: 1
severity_order: [critical, warning, info]
dedup_label: evolution-found
isolation_threshold: 3
failure_label: evolution-isolated
# M5 收缩（pack-seam）：引擎工具改由 infra-core memory rule pack 提供
# （rule_packs 引用即继承 pack 定义；infra-* 入口随 scanner venv 安装）。
# inline wins 语义（resolve_rule_packs）仅用于 memory-core 原生未迁工具
# （consistency_check / validate_project）。
# error_patterns 曾以 registry_jsonl inline override 保住扫描连续性
# （infra v0.5.1 引擎 run_audit_tool 不支持 jsonl stdout）——引擎补 jsonl
# 逐行解析分支（infra-core #80）后已移除 override，回归 pack 模板原生
# jsonl 路径（infra-error-patterns --repo-root {repo_root} --json）。
# 前置：pyproject 的 infra-core pin ≥ v0.6（含 #80 jsonl 分支）；
# 契约测试：tests/test_evolution_config_contract.py。
rule_packs:
  - pack: memory
audit_tools:
  - name: daily_kb_audit
    command: "memory-audit-daily --json --no-infra"
    output_format: json
  - name: consistency_check
    command: "memory-consistency-check --json"
    output_format: json
  - name: error_patterns
    # registry generated by CI step 'Generate error patterns' (memory-error-patterns --all-projects)
    output_format: registry_jsonl
    source_file: "memory/kb/patterns/registry.jsonl"
  - name: audit_layout
    command: "memory-audit-layout --target . --json"
    output_format: json
  - name: validate_project
    command: "memory-validate --target . --json"
    output_format: json
snapshot_limit: 100
