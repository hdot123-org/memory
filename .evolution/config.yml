# Human-maintained governance config. Scanner reads only, never writes.
max_issues_per_tick: 3
severity_order: [critical, warning, info]
dedup_label: evolution-found
isolation_threshold: 3
failure_label: evolution-isolated
audit_tools:
  - name: daily_kb_audit
    command: "memory-audit-daily --json"
    output_format: json
  - name: consistency_check
    command: "memory-consistency-check --json"
    output_format: json
  - name: error_patterns
    command: "memory-error-patterns"
    output_format: registry_jsonl
    source_file: "memory/kb/patterns/registry.jsonl"
snapshot_limit: 100
