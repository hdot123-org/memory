# Human-maintained governance config. Scanner reads only, never writes.
max_issues_per_tick: 1
max_self_audit_issues_per_tick: 1
max_code_hygiene_issues_per_tick: 1
severity_order: [critical, warning, info]
dedup_label: evolution-found
isolation_threshold: 3
failure_label: evolution-isolated
# M5 收缩（pack-seam）：引擎工具改由 infra-core memory rule pack 提供
# （rule_packs 引用即继承 pack 定义；infra-* 入口随 scanner venv 安装）。
# inline wins 语义（resolve_rule_packs）用于两类保留条目：
# 1. memory-core 原生未迁工具（consistency_check / validate_project）
# 2. error_patterns：infra v0.5.1 引擎 run_audit_tool 只支持 registry_jsonl
#    文件模式，pack 的 jsonl stdout 模板无法被解析（实测 decode 失败）——
#    保留 registry 文件模式（registry 由 reusable 的 Generate 步产出）；
#    引擎支持 jsonl stdout 后可移除本 override。
rule_packs:
  - pack: memory
audit_tools:
  - name: consistency_check
    command: "memory-consistency-check --json"
    output_format: json
  - name: validate_project
    command: "memory-validate --target . --json"
    output_format: json
  - name: error_patterns
    # registry generated by reusable step 'Generate error patterns' (infra-error-patterns)
    output_format: registry_jsonl
    source_file: "memory/kb/patterns/registry.jsonl"
snapshot_limit: 100
