[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-core"
version = "0.44.0"
description = "Independent memory hook core and gateway runtime."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "posthog>=3.0,<8.0",
    "mcp>=1.0,<2.0",
    "pyyaml>=6.0",
    "infra-core @ git+https://github.com/hdot123-org/infra-core.git@v0.5.1",
]
license = "MIT"
authors = [
    { name = "busiji" },
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

keywords = ["memory", "hooks", "project-management", "schema"]

[project.urls]
Homepage = "https://github.com/hdot123-org/memory"
Repository = "https://github.com/hdot123-org/memory"
"Bug Tracker" = "https://github.com/hdot123-org/memory/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    "mypy>=1.10",
    "requests>=2.28",
    "pip-tools>=7.0",
    "deptry>=0.15",
    "vulture>=2.10",
    "pdoc>=14.0",
    "mcp>=1.0,<2.0",
]

# M5 收缩：evolution 引擎面六入口已迁 infra-core（infra-daily-audit /
# infra-layout-audit / infra-error-patterns / infra-self-audit /
# infra-hygiene-audit / infra-sync-versions）；memory-plan-residue
# 执行体在 infra_core.packs.memory.layout_audit。
[project.scripts]
memory-promote = "memory_core.tools.promote_global_kb:main"
memory-init = "memory_core.tools.init_project_memory:main"
memory-migrate = "memory_core.tools.migrate_project_memory:main"
memory-validate = "memory_core.tools.validate_project_memory:main"
memory-hook-gateway = "memory_core.tools.hook_runtime_guard:gateway_main"
memory-factory-hooks = "memory_core.tools.factory_global_hooks:main"
memory-consistency-check = "memory_core.tools.consistency_check:main"
memory-plan-residue = "infra_core.packs.memory.layout_audit:plan_main"
memory-apply-residue-plan = "memory_core.tools.apply_residue_plan:main"
memory-ownership = "memory_core.tools.ownership_cli:main"
memory-verify-consumer = "memory_core.tools.verify_consumer:main"
memory-integrity-resign = "memory_core.tools.memory_integrity_resign:main"
memory-lifecycle-rebuild = "memory_core.tools.project_lifecycle:rebuild_main"
memory-lifecycle-migrate = "memory_core.tools.project_lifecycle:migrate_main"
"memory-mcp-server" = "memory_core.tools.mcp_server:main_sync"

[tool.setuptools.packages.find]
include = ["memory_core*", "workspace*"]

[tool.setuptools.package-data]
workspace = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=memory_core --cov-report=term-missing --cov-fail-under=80 --durations=10"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["workspace", "templates", "memory_core/workspace"]

# mypy strict 迁移期的 [[tool.mypy.overrides]]（strict = true）已于 2026-08-22 移除：
# PR #950 起双域 CI 硬门禁（mypy --strict memory_core/ + scripts/）全局生效，
# 逐模块 overrides 不再承担门禁职责，且在 scripts/ 域触发 "unused section(s)" note。

[tool.deptry]
ignore = [
    "tomllib",  # stdlib in Python 3.11+
    "yaml",
]
exclude = [
    "tests",
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    "build",
    "dist",
    "memory_core.egg-info",
    "memory_core/workspace",
    "workspace",
]

[tool.vulture]
exclude = ["*_validation_constants*", "vulture_whitelist.py"]
min_confidence = 60

[tool.deptry.per_rule_ignores]
DEP001 = [
    "memory_hook_adapters",
    "memory_hook_config",
    "memory_hook_core",
    "memory_hook_impls",
    "memory_hook_interfaces",
    "memory_hook_schema",
    "memory_hook_integrity_manifest",
    "cmux_hook_state",
    "_validation_constants",
    "_file_utils",
    "_rule_helpers",
    "_rule_errors",
    "_rule_types",
    "_guard_classify",
    "_guard_patterns",
    "_redaction",
    "_scope_resolver_base",
    "_utils",
    "_gateway_config",
    "_gateway_artifacts",
    "_gateway_telemetry",
    "_gateway_policy",
    "_gateway_dispatch",
    "_gateway_handlers",
    "_audit_project",
    "_audit_checks",
    "_audit_infra",
    "_audit_server",
    "_audit_report",
    "_audit_cli",
    "_audit_patch_redirect",
    "_migrate_constants",
    "_migrate_hooks",
    "_migrate_v05",
    "_migrate_registry",
    "_migrate_rollback",
    "_migrate_orchestration",
    "_migrate_cli",
    "_migrate_patch_redirect",
    "business_policy_checks",
    "error_logger",
    "yaml",
    "memory_hook_gateway",
    "tomllib",
    "evolution_adapters",
    "evolution_utils",
    "evolution_heartbeat",  # scripts/ 本地模块：scanner 反向守护 heartbeat（INFRA-588）
    "guard_cli",  # scripts/ 本地模块：check_boundary / check_doc_classification 共享 CLI 骨架 (INFRA-559)
    "_init_autofill",
    "_init_config",
    "_init_finalize",
    "_init_hooks",
    "_init_pipeline",
    "_init_render",
    "_init_templates_core",
    "_init_templates_misc",
    "_init_templates_plans",
]
DEP002 = [
    "pytest-cov",
    "mypy",
    "requests",
    "pytest-rerunfailures",
    "pip-tools",
    "deptry",
    "vulture",
    "pdoc",
]


