target-version = "py312"
line-length = 120
exclude = ["memory_core/workspace", "workspace", "templates", "vulture_whitelist.py"]

[lint]
select = ["E", "F", "W", "I", "C901", "UP", "B", "SIM", "PTH"]
ignore = ["E501", "E402"]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
"memory_core/tools/memory_hook_gateway.py" = ["F821", "F401"]
"memory_core/tools/memory_hook_impls.py" = ["F401"]
